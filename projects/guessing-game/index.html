<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Guessing Game</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4F46E5,#7C3AED);
    padding:20px;
}

.container{
    width:100%;
    max-width:450px;
    background:rgba(255,255,255,0.95);
    backdrop-filter:blur(10px);
    border-radius:20px;
    padding:35px;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
    text-align:center;
}

h1{
    color:#222;
    margin-bottom:10px;
}

.subtitle{
    color:#666;
    margin-bottom:25px;
}

.input-group{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:14px;
    border:2px solid #ddd;
    border-radius:12px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#4F46E5;
}

button{
    padding:14px 20px;
    border:none;
    border-radius:12px;
    background:#4F46E5;
    color:white;
    cursor:pointer;
    font-size:16px;
    transition:0.3s;
}

button:hover{
    transform:translateY(-2px);
}

.result{
    margin-top:25px;
    padding:15px;
    border-radius:12px;
    background:#f3f4f6;
    font-weight:600;
}

.stats{
    margin-top:20px;
    display:flex;
    justify-content:space-between;
    font-size:14px;
    color:#555;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.low{
    background:#fef3c7;
    color:#92400e;
}

.high{
    background:#fee2e2;
    color:#991b1b;
}

@media(max-width:500px){
    .input-group{
        flex-direction:column;
    }

    button{
        width:100%;
    }
}
</style>
</head>
<body>

<div class="container">

    <h1>🎯 Guess The Number</h1>
    <p class="subtitle">Guess a number between 1 and 50</p>

    <div class="input-group">
        <input type="number" id="guessInput" placeholder="Enter number">
        <button onclick="checkGuess()">Guess</button>
    </div>

    <div class="result" id="result">
        Start guessing... 🍀
    </div>

    <div class="stats">
        <span>Attempts: <b id="attempts">0</b></span>
        <span>Best Score: <b id="best">-</b></span>
    </div>

</div>

<script>

let secretNumber = Math.floor(Math.random() * 50) + 1;
let attempts = 0;
let bestScore = null;

function checkGuess(){

    const guess = Number(document.getElementById("guessInput").value);
    const result = document.getElementById("result");

    if(!guess || guess < 1 || guess > 50){
        result.innerHTML = "⚠️ Enter a number between 1 and 50";
        return;
    }

    attempts++;
    document.getElementById("attempts").innerText = attempts;

    if(guess === secretNumber){

        result.className = "result success";
        result.innerHTML = `🎉 Correct! Number was ${secretNumber}`;

        if(bestScore === null || attempts < bestScore){
            bestScore = attempts;
            document.getElementById("best").innerText = bestScore;
        }

        setTimeout(() => {
            secretNumber = Math.floor(Math.random() * 50) + 1;
            attempts = 0;
            document.getElementById("attempts").innerText = 0;
            document.getElementById("guessInput").value = "";
            result.className = "result";
            result.innerHTML = "New Game Started 🚀";
        }, 2500);

    }
    else if(guess < secretNumber){

        result.className = "result low";
        result.innerHTML = "📉 Too Low! Try Higher";

    }
    else{

        result.className = "result high";
        result.innerHTML = "📈 Too High! Try Lower";

    }
}

document.getElementById("guessInput")
.addEventListener("keypress",function(e){
    if(e.key==="Enter"){
        checkGuess();
    }
});

</script>

</body>
</html>
